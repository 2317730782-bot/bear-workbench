<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小熊の工作台</title>
<style>
/* ========== CSS Variables & Global Reset ========== */
:root {
  --pink-50: #fff0f5;
  --pink-100: #ffe0ea;
  --pink-200: #ffc2d6;
  --pink-300: #ffa3bf;
  --pink-400: #ff85a8;
  --pink-500: #ff6b8a;
  --pink-600: #e85573;
  --pink-700: #cc4466;
  --bg-main: #fff5f7;
  --bg-card: #ffffff;
  --bg-sidebar: #ffe8ef;
  --text-primary: #5a3e4b;
  --text-secondary: #8b6b7a;
  --text-muted: #b899a6;
  --border-light: #ffd4e0;
  --border-soft: #ffe0ea;
  --shadow-sm: 0 2px 8px rgba(255, 107, 138, 0.12);
  --shadow-md: 0 4px 16px rgba(255, 107, 138, 0.15);
  --shadow-lg: 0 8px 32px rgba(255, 107, 138, 0.18);
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --font-main: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif;
  --accent-green: #7ecba1;
  --accent-blue: #8cb4f0;
  --accent-purple: #c4a8e8;
  --accent-yellow: #f5d78c;
  --accent-orange: #f5a97f;
  --accent-teal: #8bd5ca;
  --dot-color: rgba(255, 150, 170, 0.12);
  --dot-size: 6px;
  --dot-spacing: 28px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-main);
  background: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* Polka dot background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle, var(--dot-color) 1px, transparent 1px),
    radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
  background-size: var(--dot-spacing) var(--dot-spacing);
  background-position: 0 0, calc(var(--dot-spacing)/2) calc(var(--dot-spacing)/2);
  pointer-events: none;
  z-index: 0;
}

/* ========== App Shell ========== */
.app-container {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg-main);
  overflow: hidden;
}

/* ========== Sidebar ========== */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 280px;
  background: linear-gradient(180deg, #ffe8ef 0%, #ffdce6 50%, #ffe0ea 100%);
  border-right: 2px solid var(--border-light);
  z-index: 100;
  transform: translateX(-100%);
  transition: transform var(--transition);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar.open { transform: translateX(0); }

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(90, 62, 75, 0.3);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}

.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-logo {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 3px 12px rgba(255, 107, 138, 0.25);
}

.sidebar-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--pink-600);
  letter-spacing: 0.5px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  -webkit-overflow-scrolling: touch;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 2px;
  position: relative;
  text-decoration: none;
  user-select: none;
}

.nav-item:hover { background: rgba(255, 255, 255, 0.5); }
.nav-item.active {
  background: white;
  color: var(--pink-600);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.nav-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
  background: var(--pink-50);
}

.nav-item.active .nav-icon {
  background: linear-gradient(135deg, var(--pink-300), var(--pink-400));
  color: white;
}

.nav-badge {
  margin-left: auto;
  background: var(--pink-500);
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

/* ========== Main Content ========== */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 100%;
}

.top-bar {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  background: var(--bg-main);
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.menu-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-sm);
  color: var(--pink-500);
  transition: all var(--transition);
}

.menu-btn:active { transform: scale(0.94); background: var(--pink-50); }

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}

.top-bar-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  border: none;
  background: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
  color: var(--text-secondary);
  transition: all var(--transition);
}

.icon-btn:active { transform: scale(0.94); background: var(--pink-50); }

/* ========== Page Container ========== */
.page-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.page { display: none; }
.page.active { display: block; }

/* ========== Cards ========== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  border: 1.5px solid var(--border-soft);
  transition: all var(--transition);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .emoji { font-size: 20px; }

/* ========== Todo Items ========== */
.todo-list { list-style: none; }

.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--pink-50);
  margin-bottom: 8px;
  transition: all var(--transition);
  cursor: pointer;
}

.todo-item.done {
  opacity: 0.55;
  background: #f5f5f5;
}

.todo-item.done .todo-text { text-decoration: line-through; color: var(--text-muted); }

.todo-check {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 2px solid var(--pink-300);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  font-size: 13px;
  color: transparent;
}

.todo-item.done .todo-check {
  background: var(--pink-400);
  border-color: var(--pink-400);
  color: white;
}

.todo-text { flex: 1; font-size: 14px; line-height: 1.5; }
.todo-del {
  opacity: 0;
  font-size: 16px;
  color: var(--text-muted);
  padding: 4px;
  cursor: pointer;
  transition: all var(--transition);
  border-radius: 8px;
}

.todo-item:hover .todo-del { opacity: 1; }
.todo-del:active { background: var(--pink-100); }

.add-todo {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.add-todo input {
  flex: 1;
  padding: 11px 16px;
  border: 2px dashed var(--pink-200);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: var(--font-main);
  background: transparent;
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition);
}

.add-todo input:focus { border-color: var(--pink-400); background: white; }
.add-todo input::placeholder { color: var(--text-muted); }

.add-btn {
  padding: 10px 18px;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  color: white;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-main);
  white-space: nowrap;
  box-shadow: 0 3px 12px rgba(255, 107, 138, 0.25);
  transition: all var(--transition);
}

.add-btn:active { transform: scale(0.96); opacity: 0.9; }

/* ========== Inbox ========== */
.inbox-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-chip {
  padding: 7px 15px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1.5px solid var(--border-light);
  background: white;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
}

.filter-chip.active {
  background: var(--pink-400);
  border-color: var(--pink-400);
  color: white;
}

.inbox-item {
  display: flex;
  gap: 12px;
  padding: 14px;
  background: white;
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  border: 1.5px solid var(--border-soft);
  align-items: flex-start;
}

.inbox-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.inbox-body { flex: 1; min-width: 0; }
.inbox-text { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
.inbox-meta { font-size: 11px; color: var(--text-muted); }
.inbox-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}

.inbox-action {
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  border: 1px solid var(--border-light);
  background: white;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font-main);
  transition: all var(--transition);
}

.inbox-action:active { background: var(--pink-100); }
.inbox-action.primary { background: var(--pink-50); color: var(--pink-600); border-color: var(--pink-200); }

/* ========== Kanban ========== */
.kanban-columns {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}

.kanban-col {
  min-width: 220px;
  flex: 1;
  background: var(--pink-50);
  border-radius: var(--radius-lg);
  padding: 14px;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
}

.kanban-col-header {
  font-size: 13px;
  font-weight: 700;
  color: var(--pink-600);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.kanban-col-count {
  font-size: 11px;
  background: var(--pink-200);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--pink-600);
}

.kanban-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--border-soft);
  cursor: pointer;
  transition: all var(--transition);
}

.kanban-card:active { transform: scale(0.98); }

.kanban-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.kanban-card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }

.tag {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  background: var(--pink-100);
  color: var(--pink-600);
}

.tag.green { background: #d4f0e0; color: #5a9e6f; }
.tag.blue { background: #dce8f8; color: #5a7eb8; }
.tag.purple { background: #e8dcf5; color: #8a6ab8; }
.tag.orange { background: #fce8d8; color: #b8784a; }

.kanban-card-meta { font-size: 11px; color: var(--text-muted); }
.add-kanban-btn {
  width: 100%;
  padding: 10px;
  border: 2px dashed var(--pink-200);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-main);
  transition: all var(--transition);
}

.add-kanban-btn:active { border-color: var(--pink-400); color: var(--pink-400); }

/* ========== Template ========== */
.template-grid {
  display: grid;
  gap: 12px;
}

.template-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px;
  border: 1.5px solid var(--border-soft);
  cursor: pointer;
  transition: all var(--transition);
}

.template-card:active { transform: scale(0.98); }

.template-preview {
  background: var(--pink-50);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
  white-space: pre-wrap;
  max-height: 100px;
  overflow: hidden;
  position: relative;
}

.template-preview::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30px;
  background: linear-gradient(transparent, var(--pink-50));
}

.template-name { font-weight: 600; font-size: 14px; }
.template-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

/* ========== Inspiration ========== */
.inspo-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  border: 1.5px solid var(--border-soft);
}

.inspo-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.inspo-platform {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff5a5f, #ff7b7f);
  color: white;
}

.inspo-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.inspo-breakdown {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  background: var(--pink-50);
  border-radius: var(--radius-md);
  padding: 10px;
}

.inspo-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

/* ========== Learning ========== */
.learning-section { margin-bottom: 20px; }

.learning-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: white;
  border-radius: var(--radius-md);
  margin-bottom: 6px;
  border: 1px solid var(--border-soft);
}

.learning-check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--pink-300);
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: transparent;
  transition: all var(--transition);
}

.learning-check.done {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: white;
}

.learning-text { flex: 1; font-size: 13px; }
.learning-text.done { text-decoration: line-through; color: var(--text-muted); }

/* ========== Horoscope ========== */
.horoscope-card {
  background: linear-gradient(135deg, #f8e8ff, #ffe8f0);
  border-radius: var(--radius-xl);
  padding: 24px;
  text-align: center;
  border: 2px solid var(--border-light);
}

.horoscope-sign {
  font-size: 48px;
  margin-bottom: 8px;
}

.horoscope-date {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.horoscope-section {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  text-align: left;
}

.horoscope-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--pink-600);
  margin-bottom: 4px;
}

.horoscope-text { font-size: 13px; line-height: 1.6; }

/* ========== Memorial ========== */
.memorial-countdown {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}

.countdown-card {
  min-width: 140px;
  background: linear-gradient(135deg, #ffe8f0, #f0e0ff);
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
  border: 1.5px solid var(--border-light);
  flex-shrink: 0;
}

.countdown-days {
  font-size: 36px;
  font-weight: 800;
  color: var(--pink-500);
}

.countdown-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.countdown-date { font-size: 11px; color: var(--text-muted); }

/* ========== Shopping ========== */
.shop-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: white;
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  border: 1px solid var(--border-soft);
}

.shop-info { flex: 1; min-width: 0; }
.shop-name { font-size: 14px; font-weight: 600; }
.shop-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.shop-price { font-size: 14px; font-weight: 700; color: var(--pink-500); white-space: nowrap; }
.shop-bought {
  opacity: 0.5;
}

.shop-bought .shop-name { text-decoration: line-through; }

/* ========== Finance ========== */
.finance-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.finance-stat {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
  border: 1.5px solid var(--border-soft);
}

.finance-stat-amount {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}

.finance-stat-label { font-size: 11px; color: var(--text-muted); }
.finance-stat.income .finance-stat-amount { color: var(--accent-green); }
.finance-stat.expense .finance-stat-amount { color: var(--pink-500); }
.finance-stat.balance .finance-stat-amount { color: var(--accent-blue); }
.finance-stat.debt .finance-stat-amount { color: var(--accent-orange); }

.pet-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding: 10px 16px;
  background: white;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-soft);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.pet-toggle.active {
  background: var(--pink-50);
  color: var(--pink-600);
  border-color: var(--pink-300);
}

/* ========== Reading ========== */
.reading-section {
  margin-bottom: 16px;
}

.reading-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.reading-section-title {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.reading-toggle {
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid var(--border-light);
  background: transparent;
  font-family: var(--font-main);
}

.reading-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  border: 1px solid var(--border-soft);
  margin-bottom: 8px;
}

.reading-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.reading-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

/* ========== Settings ========== */
.settings-group {
  margin-bottom: 20px;
}

.settings-group-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: white;
  border-radius: var(--radius-md);
  margin-bottom: 6px;
  border: 1px solid var(--border-soft);
}

.setting-label {
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Toggle Switch */
.toggle {
  width: 48px;
  height: 28px;
  border-radius: 14px;
  background: var(--pink-200);
  cursor: pointer;
  position: relative;
  transition: all var(--transition);
  flex-shrink: 0;
}

.toggle.on { background: var(--pink-400); }

.toggle::after {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: white;
  top: 2px;
  left: 2px;
  transition: all var(--transition);
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

.toggle.on::after { left: 22px; }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(90, 62, 75, 0.4);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: white;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px 20px 32px;
  transform: translateY(100%);
  transition: transform var(--transition);
}

.modal-overlay.active .modal { transform: translateY(0); }

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--pink-200);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 16px;
  text-align: center;
}

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }

.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: var(--font-main);
  outline: none;
  background: var(--pink-50);
  color: var(--text-primary);
  transition: all var(--transition);
}

.form-input:focus, .form-textarea:focus { border-color: var(--pink-400); background: white; }
.form-textarea { resize: vertical; min-height: 80px; }

.form-select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238b6b7a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 36px;
}

.btn-row { display: flex; gap: 10px; margin-top: 16px; }

.btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-main);
  border: none;
  transition: all var(--transition);
  text-align: center;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
  color: white;
  box-shadow: 0 3px 12px rgba(255, 107, 138, 0.25);
}

.btn-secondary {
  background: var(--pink-50);
  color: var(--text-secondary);
  border: 1.5px solid var(--border-light);
}

.btn:active { transform: scale(0.97); }

/* ========== Empty State ========== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; line-height: 1.6; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text-primary);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 300;
  transition: transform var(--transition);
  pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 4px; }

/* ========== Responsive ========== */
@media (min-width: 481px) {
  .app-container {
    border-left: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
  }
}

/* ========== PWA-style safe area ========== */
@supports(padding: max(0px)) {
  .top-bar { padding-top: max(12px, env(safe-area-inset-top)); }
  .page-container { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🐻</div>
      <div class="sidebar-title">小熊の工作台</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-bar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="page-title" id="pageTitle">今日任务</div>
      <div class="top-bar-actions">
        <button class="icon-btn" id="searchBtn" title="搜索">🔍</button>
      </div>
    </div>
    <div class="page-container" id="pageContainer"></div>
  </main>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== APP CORE ==========
const STORAGE_KEY = 'bear_workspace_data';

const defaultData = {
  todos: [],
  inbox: [],
  kanban: { todo: [], doing: [], done: [] },
  customTemplates: [],
  inspirations: [],
  learning: {
    records: []
  },
  horoscope: { sign: '双鱼座', signEmoji: '🐟', dateRange: '2.19 - 3.20', birthday: '3月3日' },
  memorials: [],
  period: { records: [], cycleAvg: 28, periodAvg: 5, lastPeriodStart: null },
  shopping: [],
  finance: { records: [], petOnly: false },
  reading: {
    finance: { visible: true },
    books: { visible: true },
    news: { visible: true },
    expression: { visible: true },
    aiVideos: { visible: true },
    podcasts: { visible: true }
  },
  topics: { savedTopics: [] },
  scripts: [],
  english: { learnedDates: [], favorites: [] },
  posture: { checkins: [], records: [], favorites: [], reminder: { enabled: false, time: '14:00' } },
  settings: {
    modules: {
      todo: true, inbox: true, kanban: true,
      inspiration: true, learning: true, topics: true, posture: true, horoscope: true,
      memorial: true, period: true, shopping: true, finance: true,
      reading: true, english: true, settings: true
    },
    tags: ['宠物用品', '纪念日礼物', '出行行李', '数码好物', '美妆护肤', '家居生活']
  }
};

let appData = {};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      appData = JSON.parse(raw);
      // Merge with defaults for new fields
      appData = deepMerge(defaultData, appData);
    } else {
      appData = JSON.parse(JSON.stringify(defaultData));
    }
  } catch(e) {
    appData = JSON.parse(JSON.stringify(defaultData));
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch(e) {
    showToast('存储空间不足，请清理数据');
  }
}

function deepMerge(target, source) {
  const result = JSON.parse(JSON.stringify(target));
  for (const key in source) {
    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      result[key] = deepMerge(result[key] || {}, source[key]);
    } else {
      result[key] = source[key];
    }
  }
  return result;
}

// ========== NAVIGATION ==========
const modules = [
  { id: 'todo', name: '今日任务', icon: '📋', emoji: '✅', group: '' },
  { id: 'inbox', name: '收件箱', icon: '📥', emoji: '📨', group: '' },
  { id: 'kanban', name: '看板', icon: '📌', emoji: '🗂️', group: '' },
  { id: 'horoscope', name: '每日星运', icon: '⭐', emoji: '🌟', group: '🌸 生活' },
  { id: 'memorial', name: '倒计时', icon: '💝', emoji: '💕', group: '🌸 生活' },
  { id: 'period', name: '经期记录', icon: '🌸', emoji: '🩷', group: '🌸 生活' },
  { id: 'shopping', name: '待买清单', icon: '🛒', emoji: '🛍️', group: '🌸 生活' },
  { id: 'finance', name: '简易记账', icon: '💰', emoji: '💳', group: '🌸 生活' },
  { id: 'reading', name: '每日阅读', icon: '📖', emoji: '📰', group: '🌱 个人提升' },
  { id: 'english', name: '英语学习', icon: '🔤', emoji: '📚', group: '🌱 个人提升' },
  { id: 'learning', name: '自媒体学习', icon: '📹', emoji: '🎓', group: '🌱 个人提升' },
  { id: 'posture', name: '体态管理', icon: '🧘', emoji: '💪', group: '🌱 个人提升' },
  { id: 'topics', name: '选题库', icon: '🎯', emoji: '🔖', group: '💼 工作' },
  { id: 'inspiration', name: '热点拆分', icon: '💡', emoji: '✨', group: '💼 工作' },
  { id: 'scripts', name: '脚本管理', icon: '🎬', emoji: '🎞️', group: '💼 工作' },
  { id: 'settings', name: '设置', icon: '⚙️', emoji: '🔧', group: '' }
];

let currentPage = 'todo';

function getVisibleModules() {
  return modules.filter(m => {
    if (m.id === 'settings') return true;
    return appData.settings.modules[m.id] !== false;
  });
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const visible = getVisibleModules();
  let html = '';
  let lastGroup = '___init___';
  
  visible.forEach(m => {
    // 插入分组标题
    if (m.group !== lastGroup) {
      lastGroup = m.group;
      if (m.group) {
        html += `<div style="font-size:11px;font-weight:700;color:var(--pink-400);padding:14px 16px 6px;letter-spacing:1px">${m.group}</div>`;
      } else {
        html += `<div style="height:8px"></div>`;
      }
    }
    html += `
    <div class="nav-item ${m.id === currentPage ? 'active' : ''}" data-page="${m.id}">
      <span class="nav-icon">${m.icon}</span>
      ${m.name}
      ${m.id === 'inbox' && appData.inbox.length > 0 ? `<span class="nav-badge">${appData.inbox.length}</span>` : ''}
    </div>`;
  });
  
  nav.innerHTML = html;

  // Click handlers
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      navigateTo(page);
      closeSidebar();
    });
  });
}

function navigateTo(page) {
  currentPage = page;
  const mod = modules.find(m => m.id === page);
  document.getElementById('pageTitle').textContent = mod ? mod.name : '';
  renderSidebar();
  renderPage(page);
}

function renderPage(page) {
  const container = document.getElementById('pageContainer');
  switch(page) {
    case 'todo': renderTodoPage(container); break;
    case 'inbox': renderInboxPage(container); break;
    case 'kanban': renderKanbanPage(container); break;
    case 'inspiration': renderInspirationPage(container); break;
    case 'learning': renderLearningPage(container); break;
    case 'posture': renderPosturePage(container); break;
    case 'scripts': renderScriptsPage(container); break;
    case 'horoscope': renderHoroscopePage(container); break;
    case 'memorial': renderMemorialPage(container); break;
    case 'period': renderPeriodPage(container); break;
    case 'shopping': renderShoppingPage(container); break;
    case 'finance': renderFinancePage(container); break;
    case 'reading': renderReadingPage(container); break;
    case 'english': renderEnglishPage(container); break;
    case 'topics': renderTopicsPage(container); break;
    case 'settings': renderSettingsPage(container); break;
  }
}

// ========== SIDEBAR ==========
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('active');
    renderSidebar();
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

// ========== TODAY'S TASKS ==========
function renderTodoPage(container) {
  const today = new Date().toDateString();
  const todayTodos = appData.todos.filter(t => t.date === today);

  let html = `
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">✅</span>今日任务</div>
        <span style="font-size:12px;color:var(--text-muted)">${todayTodos.filter(t=>t.done).length}/${todayTodos.length}</span>
      </div>
      <ul class="todo-list" id="todoList">`;

  if (todayTodos.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🎉</div>
      <div class="empty-state-text">今天还没有任务哦～<br>添加一个吧！</div>
    </div>`;
  } else {
    todayTodos.forEach((t, i) => {
      html += `
        <li class="todo-item ${t.done ? 'done' : ''}" data-idx="${i}" data-id="${t.id}">
          <div class="todo-check">✓</div>
          <div class="todo-text">${escapeHtml(t.text)}</div>
          <div class="todo-del">×</div>
        </li>`;
    });
  }

  html += `</ul>
    <div class="add-todo">
      <input type="text" id="todoInput" placeholder="添加新任务..." maxlength="100">
      <button class="add-btn" id="addTodoBtn">＋ 添加</button>
    </div>
  </div>`;

  container.innerHTML = html;

  // Event handlers
  setTimeout(() => {
    const list = document.getElementById('todoList');
    if (!list) return;

    list.querySelectorAll('.todo-item').forEach(item => {
      const id = item.dataset.id;
      item.querySelector('.todo-check').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleTodo(id);
      });
      item.querySelector('.todo-del').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTodo(id);
      });
    });

    const input = document.getElementById('todoInput');
    const btn = document.getElementById('addTodoBtn');
    if (input && btn) {
      const addFn = () => {
        const text = input.value.trim();
        if (text) { addTodo(text); input.value = ''; input.focus(); }
      };
      btn.addEventListener('click', addFn);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addFn();
      });
    }
  }, 0);
}

function addTodo(text) {
  const today = new Date().toDateString();
  appData.todos.push({
    id: Date.now().toString(),
    text,
    date: today,
    done: false,
    createdAt: Date.now()
  });
  saveData();
  renderPage('todo');
}

function toggleTodo(id) {
  const todo = appData.todos.find(t => t.id === id);
  if (todo) { todo.done = !todo.done; saveData(); renderPage('todo'); }
}

function deleteTodo(id) {
  appData.todos = appData.todos.filter(t => t.id !== id);
  saveData();
  renderPage('todo');
}

// ========== INBOX ==========
let inboxFilter = 'all';

function renderInboxPage(container) {
  let items = appData.inbox;
  if (inboxFilter !== 'all') {
    items = items.filter(i => i.source === inboxFilter);
  }

  let html = `
    <div class="inbox-filters">
      <div class="filter-chip ${inboxFilter==='all'?'active':''}" data-filter="all">全部</div>
      <div class="filter-chip ${inboxFilter==='idea'?'active':''}" data-filter="idea">💡 灵感</div>
      <div class="filter-chip ${inboxFilter==='star'?'active':''}" data-filter="star">⭐ 星运</div>
      <div class="filter-chip ${inboxFilter==='quick'?'active':''}" data-filter="quick">✏️ 随手记</div>
      <div class="filter-chip ${inboxFilter==='private'?'active':''}" data-filter="private">📌 私人待办</div>
      <div class="filter-chip ${inboxFilter==='note'?'active':''}" data-filter="note">📝 学习笔记</div>
    </div>
    <div id="inboxList">`;

  if (items.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📥</div>
      <div class="empty-state-text">收件箱空空如也～<br>灵感碎片会出现在这里</div>
    </div>`;
  } else {
    items.forEach(item => {
      const sourceMap = { idea: '💡 爆款灵感', star: '⭐ 星运灵感', quick: '✏️ 随手想法', private: '📌 私人待办', note: '📝 学习笔记' };
      html += `
        <div class="inbox-item">
          <div class="inbox-icon" style="background:var(--pink-50)">${item.icon || '📌'}</div>
          <div class="inbox-body">
            <div class="inbox-text">${escapeHtml(item.text)}</div>
            <div class="inbox-meta">${sourceMap[item.source] || item.source} · ${timeAgo(item.time)}</div>
            <div class="inbox-actions">
              <button class="inbox-action primary" data-action="kanban" data-id="${item.id}">📌 分拣至看板</button>
              <button class="inbox-action" data-action="archive" data-id="${item.id}">📦 归档</button>
              <button class="inbox-action" data-action="delete" data-id="${item.id}">🗑️</button>
            </div>
          </div>
        </div>`;
    });
  }

  html += `</div>`;

  // Quick add
  html += `
    <div class="card" style="margin-top:16px">
      <div class="add-todo">
        <input type="text" id="inboxInput" placeholder="快速记录灵感碎片..." maxlength="200">
        <button class="add-btn" id="addInboxBtn">＋ 存入</button>
      </div>
    </div>`;

  container.innerHTML = html;

  setTimeout(() => {
    // Filter chips
    container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inboxFilter = chip.dataset.filter;
        renderPage('inbox');
      });
    });

    // Inbox actions
    container.querySelectorAll('.inbox-action').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        const item = appData.inbox.find(i => i.id === id);
        if (!item) return;
        if (action === 'kanban') {
          appData.kanban.todo.push({
            id: Date.now().toString(),
            title: item.text.substring(0, 50),
            tags: [],
            note: item.text,
            deadline: '',
            createdAt: Date.now()
          });
          appData.inbox = appData.inbox.filter(i => i.id !== id);
          saveData();
          renderPage('inbox');
          showToast('已分拣至看板 - 待做');
        } else if (action === 'archive') {
          item.archived = true;
          item.archivedAt = Date.now();
          saveData();
          renderPage('inbox');
          showToast('已归档');
        } else if (action === 'delete') {
          appData.inbox = appData.inbox.filter(i => i.id !== id);
          saveData();
          renderPage('inbox');
        }
      });
    });

    // Quick add
    const input = document.getElementById('inboxInput');
    const btn = document.getElementById('addInboxBtn');
    if (input && btn) {
      const addFn = () => {
        const text = input.value.trim();
        if (text) {
          appData.inbox.push({
            id: Date.now().toString(),
            text,
            source: 'quick',
            icon: '✏️',
            time: Date.now()
          });
          saveData();
          renderPage('inbox');
          input.value = '';
          input.focus();
        }
      };
      btn.addEventListener('click', addFn);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') addFn(); });
    }
  }, 0);
}

// ========== KANBAN ==========
function renderKanbanPage(container) {
  const cols = [
    { key: 'todo', title: '📋 待做', color: 'var(--pink-400)' },
    { key: 'doing', title: '🔄 进行中', color: 'var(--accent-blue)' },
    { key: 'done', title: '✅ 已完成', color: 'var(--accent-green)' }
  ];

  let html = `<div class="kanban-columns">`;
  cols.forEach(col => {
    const items = appData.kanban[col.key];
    html += `<div class="kanban-col">
      <div class="kanban-col-header">
        ${col.title}
        <span class="kanban-col-count">${items.length}</span>
      </div>`;
    items.forEach(item => {
      html += `
        <div class="kanban-card" data-id="${item.id}" data-col="${col.key}">
          <div class="kanban-card-title">${escapeHtml(item.title)}</div>
          ${item.tags && item.tags.length > 0 ? `<div class="kanban-card-tags">${item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${item.deadline ? `<div class="kanban-card-meta">📅 ${item.deadline}</div>` : ''}
          ${item.note ? `<div class="kanban-card-meta" style="margin-top:4px">${escapeHtml(item.note.substring(0, 40))}${item.note.length>40?'...':''}</div>` : ''}
        </div>`;
    });
    html += `<button class="add-kanban-btn" data-col="${col.key}">＋ 添加卡片</button></div>`;
  });
  html += `</div>`;

  // Quick add modal trigger

function moveKanbanCard(id, fromCol) {
  const order = ['todo', 'doing', 'done'];
  const idx = order.indexOf(fromCol);
  const nextIdx = (idx + 1) % 3;
  const nextCol = order[nextIdx];

  const cardIdx = appData.kanban[fromCol].findIndex(c => c.id === id);
  if (cardIdx === -1) return;

  const card = appData.kanban[fromCol].splice(cardIdx, 1)[0];
  appData.kanban[nextCol].push(card);
  saveData();
  renderPage('kanban');
  showToast(`已移至 ${nextCol === 'todo' ? '待做' : nextCol === 'doing' ? '进行中' : '已完成'}`);
}

function getRandomTemplates(count) {
  // 确保不重复：从池中随机抽取不同模板
  const pool = [...templatePool];
  const result = [];
  const usedNames = new Set();
  
  // 也排除当前已展示的
  if (appData._templateSet) {
    appData._templateSet.forEach(t => usedNames.add(t.name));
  }

  // 先从没用过的里抽
  const available = pool.filter(t => !usedNames.has(t.name));
  const shuffled = available.sort(() => Math.random() - 0.5);
  
  for (let i = 0; i < Math.min(count, shuffled.length); i++) {
    result.push({ ...shuffled[i], id: 't' + (i + 1) });
  }
  
  // 如果不够（用过了所有），补充剩余的
  if (result.length < count) {
    const remaining = pool.filter(t => !result.find(r => r.name === t.name)).sort(() => Math.random() - 0.5);
    for (let i = 0; i < count - result.length && i < remaining.length; i++) {
      result.push({ ...remaining[i], id: 't' + (result.length + 1) });
    }
  }
  
  return result;
}

// 脚本分镜生成
function generateScript(topic, duration) {
  const shotCount = duration === '30s' ? 5 : duration === '60s' ? 8 : 12;
  
  const hooks = [
    `「${topic}，我试了才知道…」`,
    `「别买${topic}之前不看这个」`,
    `「${topic}的真实体验，3分钟讲清楚」`,
    `「花了XX元踩坑${topic}，总结给你听」`
  ];
  
  const shots = [];
  shots.push({ num: 1, time: '0-3s', type: '🎬 开场Hook', shot: '正面近景/手持感', content: hooks[Math.floor(Math.random()*hooks.length)], note: '前3秒必须抓住眼球，可加悬念字幕' });
  shots.push({ num: 2, time: '3-8s', type: '😕 痛点引入', shot: '中景/产品空镜', content: `先说问题：很多人在${topic}上踩过的坑`, note: '引发共鸣，让观众觉得「这说的就是我」' });
  
  for (let i = 3; i <= shotCount - 2; i++) {
    const contentOptions = [
      `第${i-2}个要点：关于${topic}的关键细节`,
      `实操展示：${topic}的具体使用场景`,
      `对比测试：${topic}的不同方案`,
      `避坑提醒：${topic}常见的误区`,
      `进阶技巧：让${topic}效果翻倍`
    ];
    shots.push({ 
      num: i, 
      time: `${(i-1)*Math.floor(30/shotCount)}-${i*Math.floor(30/shotCount)}s`, 
      type: `📝 内容${i-2}`, 
      shot: ['特写/产品细节', '中景/操作过程', '近景/表情反应', '全景/环境交代'][i % 4], 
      content: contentOptions[(i-3) % contentOptions.length], 
      note: ['注意光线柔和', '收音清晰，减少环境噪音', '字幕同步标注关键词', '可加BGM铺垫情绪', '适当留白给观众消化'][i % 5]
    });
  }
  
  shots.push({ num: shotCount-1, time: `${(shotCount-2)*Math.floor(30/shotCount)}-${(shotCount-1)*Math.floor(30/shotCount)}s`, type: '💡 总结', shot: '中近景/正面', content: `一句话总结${topic}的核心建议`, note: '用金句收尾，方便截图传播' });
  shots.push({ num: shotCount, time: '最后2s', type: '👋 结尾引导', shot: '正面/手势', content: '「觉得有用就收藏，关注我看更多」', note: '不要硬推，自然引导互动' });

  let html = `<div style="font-size:13px;font-weight:700;color:var(--pink-600);margin-bottom:10px">📋 《${topic}》分镜脚本 · ${duration}</div>`;
  html += `<div style="overflow-x:auto"><table style="width:100%;font-size:11px;border-collapse:collapse">`;
  html += `<tr style="background:var(--pink-100)">
    <th style="padding:6px;border:1px solid var(--border-light);text-align:center">#</th>
    <th style="padding:6px;border:1px solid var(--border-light)">时间</th>
    <th style="padding:6px;border:1px solid var(--border-light)">类型</th>
    <th style="padding:6px;border:1px solid var(--border-light)">镜头</th>
    <th style="padding:6px;border:1px solid var(--border-light)">内容/台词</th>
    <th style="padding:6px;border:1px solid var(--border-light)">备注</th>
  </tr>`;
  shots.forEach(s => {
    html += `<tr>
      <td style="padding:6px;border:1px solid var(--border-light);text-align:center;font-weight:600;color:var(--pink-500)">${s.num}</td>
      <td style="padding:6px;border:1px solid var(--border-light);white-space:nowrap;color:var(--text-muted)">${s.time}</td>
      <td style="padding:6px;border:1px solid var(--border-light);white-space:nowrap">${s.type}</td>
      <td style="padding:6px;border:1px solid var(--border-light)">${s.shot}</td>
      <td style="padding:6px;border:1px solid var(--border-light)">${escapeHtml(s.content)}</td>
      <td style="padding:6px;border:1px solid var(--border-light);color:var(--text-muted)">${s.note}</td>
    </tr>`;
  });
  html += `</table></div>`;
  html += `<div style="display:flex;gap:8px;margin-top:10px">
    <button class="add-btn" id="saveScript" style="flex:1">📥 存入灵感库</button>
  </div>`;

  const resultDiv = document.getElementById('scriptResult');
  if (resultDiv) {
    resultDiv.innerHTML = html;
    document.getElementById('saveScript')?.addEventListener('click', () => {
      const todayCount = appData.inspirations.filter(i => isToday(i.createdAt)).length;
      if (todayCount >= 8) { showToast('今日已达上限（8条）'); return; }
      const scriptText = shots.map(s => `${s.num}.[${s.time}] ${s.type} | ${s.shot}\n   ${s.content}\n   → ${s.note}`).join('\n');
      appData.inspirations.push({
        id: Date.now().toString(),
        title: `分镜脚本：${topic}（${duration}）`,
        breakdown: scriptText,
        platform: '脚本分镜',
        createdAt: Date.now()
      });
      saveData();
      renderPage('inspiration');
      showToast('✨ 分镜脚本已存入灵感库！');
    });
  }
}

// ========== LEARNING ==========
function renderLearningPage(container) {
  const records = appData.learning.records || [];
  const sorted = records.slice().sort((a,b) => new Date(b.date || b.createdAt) - new Date(a.date || a.createdAt));

  // 统计
  const totalTime = records.reduce((s, r) => s + (parseFloat(r.duration) || 0), 0);
  const platformCount = {};
  records.forEach(r => { if (r.platform) platformCount[r.platform] = (platformCount[r.platform]||0) + 1; });

  let html = `
    <div class="card" style="background:linear-gradient(135deg,#e8f0ff,#ffe8f0);text-align:center">
      <div style="font-size:32px;margin-bottom:4px">📚</div>
      <div style="font-size:20px;font-weight:800;color:var(--pink-500)">${totalTime}</div>
      <div style="font-size:12px;color:var(--text-secondary)">累计学习时长（小时）</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">共 ${records.length} 条学习记录</div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="add-btn" id="addLearningBtn" style="flex:1">＋ 添加学习记录</button>
    </div>`;

  // 平台分布
  if (Object.keys(platformCount).length > 0) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">📊</span>学习来源分布</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">`;
    Object.entries(platformCount).forEach(([p, c]) => {
      html += `<span class="tag" style="font-size:11px;padding:4px 10px">${p} ${c}次</span>`;
    });
    html += `</div></div>`;
  }

  // 学习记录列表
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">📝</span>学习记录</div>
    </div>`;

  if (sorted.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📚</div>
      <div class="empty-state-text">还没有学习记录<br>学了什么自己添加，不被待办清单绑架</div>
    </div>`;
  } else {
    sorted.forEach(r => {
      const d = r.date ? new Date(r.date) : new Date(r.createdAt);
      html += `
        <div style="padding:12px;background:var(--pink-50);border-radius:var(--radius-md);margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600">${escapeHtml(r.course || '未命名课程')}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
                ${r.platform ? `<span class="tag" style="font-size:10px;padding:2px 6px">${escapeHtml(r.platform)}</span> ` : ''}
                ${r.blogger ? `👤 ${escapeHtml(r.blogger)} · ` : ''}📅 ${d.toLocaleDateString('zh-CN', {month:'long',day:'numeric'})}
                ${r.duration ? ` · ⏱️ ${r.duration}h` : ''}
              </div>
              ${r.note ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.5">${escapeHtml(r.note)}</div>` : ''}
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0">
              <button class="inbox-action" data-action="saveLearnNote" data-id="${r.id}" style="padding:3px 8px">📥</button>
              <button class="inbox-action" data-action="delLearn" data-id="${r.id}" style="padding:3px 8px">🗑️</button>
            </div>
          </div>
        </div>`;
    });
  }

  html += `</div>`;

  container.innerHTML = html;

  setTimeout(() => {
    document.getElementById('addLearningBtn')?.addEventListener('click', showAddLearningModal);

    container.querySelectorAll('[data-action="saveLearnNote"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = records.find(rr => rr.id === btn.dataset.id);
        if (!r) return;
        appData.inbox.push({
          id: Date.now().toString(),
          text: `📝 [学习笔记] ${r.course}${r.blogger ? ' - ' + r.blogger : ''}${r.note ? '：' + r.note : ''}`,
          source: 'note',
          icon: '📝',
          time: Date.now()
        });
        saveData();
        showToast('已存入收件箱');
      });
    });
    container.querySelectorAll('[data-action="delLearn"]').forEach(btn => {
      btn.addEventListener('click', () => {
        appData.learning.records = appData.learning.records.filter(r => r.id !== btn.dataset.id);
        saveData();
        renderPage('learning');
      });
    });
  }, 0);
}

// 天干地支计算
const tianGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const diZhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const wuXingMap = { '甲乙':'木','丙丁':'火','戊己':'土','庚辛':'金','壬癸':'水' };
const baGua = ['乾☰','兑☱','离☲','震☳','巽☴','坎☵','艮☶','坤☷'];
const baGuaDesc = ['刚健进取','喜悦沟通','光明明辨','行动启动','顺势渗透','险中求胜','沉稳止守','包容承载'];

function getGanZhi(date) {
  // 简化版干支计算：基于1900年1月31日（庚子年正月初一）
  const base = new Date(1900, 0, 31);
  const diff = Math.floor((date - base) / (1000 * 60 * 60 * 24));
  const ganIdx = (diff + 0) % 10;
  const zhiIdx = (diff + 0) % 12;
  return tianGan[ganIdx] + diZhi[zhiIdx];
}

function getDayGanZhi(date) {
  // 日柱干支：基于已知参考点 2000年1月1日 = 戊午日
  const base = new Date(2000, 0, 1);
  const baseGan = 4; // 戊
  const baseZhi = 6; // 午
  const diff = Math.floor((date.setHours(0,0,0,0) - base.setHours(0,0,0,0)) / (1000 * 60 * 60 * 24));
  const ganIdx = ((diff % 10) + 10 + baseGan) % 10;
  const zhiIdx = ((diff % 12) + 12 + baseZhi) % 12;
  return tianGan[ganIdx] + diZhi[zhiIdx];
}

function getWuXing(ganZhi) {
  const gan = ganZhi[0];
  for (const key in wuXingMap) {
    if (key.includes(gan)) return wuXingMap[key];
  }
  return '土';
}

function getZhiWuXing(zhi) {
  const zhiMap = { '子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水' };
  return zhiMap[zhi] || '土';
}

function renderMemorialPage(container) {
  let html = '';

  // Countdown / count-up cards - show nearest 3
  const now = new Date();
  const upcoming = appData.memorials
    .map(m => {
      const target = new Date(m.date);
      // 正数天数：从记录日期到今天
      const daysPassed = Math.floor((now - new Date(m.date)) / (1000 * 60 * 60 * 24));
      // 倒计时：到下一个周年
      const nextAnniv = new Date(m.date);
      nextAnniv.setFullYear(now.getFullYear());
      if (nextAnniv < now) nextAnniv.setFullYear(now.getFullYear() + 1);
      const daysLeft = Math.ceil((nextAnniv - now) / (1000 * 60 * 60 * 24));
      return { ...m, daysLeft, daysPassed };
    })
    .sort((a, b) => a.daysLeft - b.daysLeft)
    .slice(0, 3);

  if (upcoming.length > 0) {
    html += `<div class="memorial-countdown">`;
    upcoming.forEach(m => {
      const isPassed = m.daysPassed > 0;
      html += `
        <div class="countdown-card">
          <div class="countdown-days">${isPassed ? m.daysPassed : m.daysLeft}</div>
          <div style="font-size:12px;color:var(--text-secondary)">${isPassed ? '天 · 已相伴' : '天后'}</div>
          <div class="countdown-label">${escapeHtml(m.name)}</div>
          <div class="countdown-date">${m.date}</div>
          ${isPassed ? `<div style="font-size:11px;color:var(--pink-400);margin-top:4px">💝 第${Math.floor(m.daysPassed/365)>0 ? Math.floor(m.daysPassed/365)+'周年' : '第一年'}</div>` : ''}
          ${m.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px">${escapeHtml(m.note.substring(0,20))}</div>` : ''}
        </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">💝</span>纪念日列表</div>
      <button class="add-btn" id="addMemorialBtn" style="padding:6px 14px;font-size:12px">＋ 添加</button>
    </div>`;

  if (appData.memorials.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">💕</div>
      <div class="empty-state-text">还没有纪念日记录～<br>添加你们的特别日子吧</div>
    </div>`;
  } else {
    appData.memorials.forEach(m => {
      const daysPassed = Math.floor((now - new Date(m.date)) / (1000 * 60 * 60 * 24));
      const isPassed = daysPassed > 0;
      html += `
        <div class="shop-item">
          <div style="font-size:28px;margin-right:8px">${m.icon || '💝'}</div>
          <div class="shop-info">
            <div class="shop-name">${escapeHtml(m.name)}</div>
            <div class="shop-meta">📅 ${m.date}${isPassed ? ` · 💝 已相伴 ${daysPassed} 天` : ''}${m.note ? ' · ' + escapeHtml(m.note.substring(0, 30)) : ''}</div>
          </div>
          <button class="inbox-action" data-action="todoFromMemorial" data-id="${m.id}">📋</button>
          <button class="inbox-action" data-action="deleteMemorial" data-id="${m.id}">🗑️</button>
        </div>`;
    });
  }

  html += `</div>`;

  container.innerHTML = html;

  setTimeout(() => {
    const addBtn = document.getElementById('addMemorialBtn');
    if (addBtn) addBtn.addEventListener('click', showAddMemorialModal);

    container.querySelectorAll('[data-action="todoFromMemorial"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = appData.memorials.find(mm => mm.id === btn.dataset.id);
        if (!m) return;
        appData.inbox.push({
          id: Date.now().toString(),
          text: `📌 [纪念日筹备] ${m.name} - 准备事项`,
          source: 'private',
          icon: '💝',
          time: Date.now()

      btn.addEventListener('click', () => {
        appData.memorials = appData.memorials.filter(m => m.id !== btn.dataset.id);
        saveData();
        renderPage('memorial');
      });
    });
  }, 0);

function renderPeriodPage(container) {
  const p = appData.period;
  let records = (p.records || []).slice().sort((a,b) => new Date(b.startDate) - new Date(a.startDate)); // 按日期降序

  // 计算平均周期和经期时长（基于有完整日期的记录）
  let cycleAvg = 28, periodAvg = 5;
  if (records.length >= 2) {
    const cycles = [];
    const sortedAsc = records.slice().sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
    for (let i = 1; i < sortedAsc.length; i++) {
      const diff = Math.floor((new Date(sortedAsc[i].startDate) - new Date(sortedAsc[i-1].startDate)) / 86400000);
      if (diff > 15 && diff < 90) cycles.push(diff);
    }
    if (cycles.length > 0) cycleAvg = Math.round(cycles.reduce((a,b)=>a+b,0) / cycles.length);
  }
  const completedRecords = records.filter(r => r.endDate);
  if (completedRecords.length > 0) {
    const days = completedRecords.map(r => Math.floor((new Date(r.endDate) - new Date(r.startDate)) / 86400000) + 1);
    periodAvg = Math.round(days.reduce((a,b)=>a+b,0) / days.length);
  }
  p.cycleAvg = cycleAvg;
  p.periodAvg = periodAvg;

  // 最近一次记录
  const latest = records[0];
  const now = new Date(); now.setHours(0,0,0,0);
  let nextPredict = null, daysToNext = null, isInPeriod = false, currentDay = null;
  let ovulationDate = null, daysToOvulation = null;

  if (latest) {
    const lastStart = new Date(latest.startDate); lastStart.setHours(0,0,0,0);
    const lastEnd = latest.endDate ? new Date(latest.endDate) : null;
    if (lastEnd) { lastEnd.setHours(0,0,0,0); isInPeriod = now >= lastStart && now <= lastEnd; }
    else { isInPeriod = now >= lastStart && now <= new Date(lastStart.getTime() + periodAvg * 86400000); }
    currentDay = Math.floor((now - lastStart) / 86400000) + 1;
    nextPredict = new Date(lastStart.getTime() + cycleAvg * 86400000);
    daysToNext = Math.ceil((nextPredict - now) / 86400000);
    // 排卵期：下次经期前14天
    ovulationDate = new Date(nextPredict.getTime() - 14 * 86400000);
    daysToOvulation = Math.ceil((ovulationDate - now) / 86400000);
  }

  // 周期分析：早了还是晚了
  let cycleAnalysis = '';
  if (records.length >= 2) {
    const sortedAsc = records.slice().sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
    const lastCycle = sortedAsc.length >= 2 ? Math.floor((new Date(sortedAsc[sortedAsc.length-1].startDate) - new Date(sortedAsc[sortedAsc.length-2].startDate)) / 86400000) : null;
    if (lastCycle !== null) {
      const diff = lastCycle - cycleAvg;
      if (diff < -3) {
        cycleAnalysis = `上次周期 ${lastCycle} 天，比平均短 ${Math.abs(diff)} 天（偏早）`;
      } else if (diff > 3) {
        cycleAnalysis = `上次周期 ${lastCycle} 天，比平均长 ${diff} 天（偏晚）`;
      } else {
        cycleAnalysis = `上次周期 ${lastCycle} 天，与平均周期接近（规律）`;
      }
    }
  }

  // 可能原因
  const reasons = [];
  if (records.length >= 2) {
    const sortedAsc = records.slice().sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
    const lastCycle = Math.floor((new Date(sortedAsc[sortedAsc.length-1].startDate) - new Date(sortedAsc[sortedAsc.length-2].startDate)) / 86400000);
    if (lastCycle < cycleAvg - 3) {
      reasons.push('压力增大或情绪波动导致周期缩短');
      reasons.push('近期饮食/作息变化影响激素水平');
      reasons.push('运动量突然增加可能提前排卵');
    } else if (lastCycle > cycleAvg + 3) {
      reasons.push('精神压力大、焦虑可能延迟排卵');
      reasons.push('体重变化过快（增重或减重）');
      reasons.push('作息不规律/熬夜影响内分泌');
      reasons.push('季节交替或环境变化');
    }
  }

  let html = '';

  // 状态卡
  html += `<div class="card" style="background:linear-gradient(135deg,#ffe0ec,#f0e0ff);text-align:center">
    <div style="font-size:36px;margin-bottom:8px">${isInPeriod ? '🌸' : '🩷'}</div>`;

  if (records.length === 0) {
    html += `<div style="font-size:16px;font-weight:700;color:var(--pink-600);margin-bottom:4px">还没有记录哦</div>
      <div style="font-size:12px;color:var(--text-muted)">点击下方按钮，记录你的经期日期吧～</div>`;
  } else if (isInPeriod) {
    html += `<div style="font-size:16px;font-weight:700;color:var(--pink-600);margin-bottom:4px">经期中 · 第 ${currentDay} 天</div>
      <div style="font-size:12px;color:var(--text-secondary)">注意保暖，少吃冰冷 🫖💕</div>`;
  } else if (daysToNext > 0) {
    html += `<div style="font-size:32px;font-weight:800;color:var(--pink-500)">${daysToNext}</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">天后预计来经期</div>
      <div style="font-size:11px;color:var(--text-muted)">预计 ${nextPredict.toLocaleDateString('zh-CN', {month:'long',day:'numeric',weekday:'short'})} · 当前周期第 ${currentDay} 天</div>`;
  } else if (daysToNext <= 0) {
    html += `<div style="font-size:16px;font-weight:700;color:var(--pink-600);margin-bottom:4px">经期预计已到，留意身体信号</div>
      <div style="font-size:12px;color:var(--text-muted)">如已开始请点击下方记录</div>`;
  }

  html += `</div>`;

  // 快速操作
  html += `<div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="add-btn" id="addPeriodBtn" style="flex:1">＋ 记录/补录经期</button>
    ${isInPeriod ? `<button class="btn btn-secondary" id="endPeriodBtn" style="flex:1">✅ 记录结束</button>` : ''}
  </div>`;

  // 统计数据
  if (records.length > 0) {
    html += `<div class="finance-summary">
      <div class="finance-stat" style="background:linear-gradient(135deg,#fff0f5,#ffe0ea)">
        <div class="finance-stat-amount" style="color:var(--pink-500)">${records.length}</div>
        <div class="finance-stat-label">📋 记录次数</div>
      </div>
      <div class="finance-stat" style="background:linear-gradient(135deg,#fff0f5,#ffe0ea)">
        <div class="finance-stat-amount" style="color:var(--pink-500)">${cycleAvg}</div>
        <div class="finance-stat-label">📅 平均周期(天)</div>
      </div>
      <div class="finance-stat" style="background:linear-gradient(135deg,#fff0f5,#ffe0ea)">
        <div class="finance-stat-amount" style="color:var(--pink-500)">${periodAvg}</div>
        <div class="finance-stat-label">🩷 平均经期(天)</div>
      </div>
      <div class="finance-stat" style="background:linear-gradient(135deg,#fff0f5,#ffe0ea)">
        <div class="finance-stat-amount" style="color:var(--pink-500);font-size:14px">${cycleAnalysis ? cycleAnalysis.split('（')[1].replace('）','') : '待分析'}</div>
        <div class="finance-stat-label">📊 周期状态</div>
      </div>
    </div>`;
  }

  // 周期分析
  if (cycleAnalysis) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">🔍</span>周期分析</div>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:8px">${cycleAnalysis}</div>`;
    if (reasons.length > 0) {
      html += `<div style="font-size:12px;font-weight:600;color:var(--pink-600);margin-bottom:4px">💡 可能原因参考：</div>
        <div style="font-size:12px;color:var(--text-muted);line-height:1.8">${reasons.map(r => `• ${r}`).join('<br>')}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-light)">
          ⚕️ 以上仅为常见原因参考，如有持续异常建议咨询医生
        </div>`;
    }
    html += `</div>`;
  }

  // 排卵期
  if (ovulationDate && daysToOvulation !== null) {
    const isOvulationNear = daysToOvulation >= -2 && daysToOvulation <= 2;
    html += `<div class="card" style="background:linear-gradient(135deg,#e8f5e9,#f0fff0)">
      <div class="card-header">
        <div class="card-title"><span class="emoji">🥚</span>排卵期预测</div>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.6">
        ${daysToOvulation > 0 ? `预计 <b style="color:var(--accent-green)">${daysToOvulation} 天后</b>进入排卵期` : daysToOvulation === 0 ? `<b style="color:var(--accent-green)">今天可能是排卵日</b> 🥚` : daysToOvulation >= -2 ? `排卵期中（约第${Math.abs(daysToOvulation)}天）` : `排卵期已过 ${Math.abs(daysToOvulation)} 天`}
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">📅 预计排卵日：${ovulationDate.toLocaleDateString('zh-CN', {month:'long',day:'numeric',weekday:'short'})}（下次经期前14天）</div>
      ${isOvulationNear ? `<div style="font-size:11px;color:var(--accent-green);margin-top:4px">⚠️ 易孕期，身体可能有轻微变化</div>` : ''}
    </div>`;
  }

  // 历史记录（按日期排序）
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">📅</span>历史记录（按日期）</div>
    </div>`;

  if (records.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🌸</div>
      <div class="empty-state-text">还没有经期记录<br>记录后可自动分析周期规律</div>
    </div>`;
  } else {
    records.forEach((r, idx) => {
      const start = new Date(r.startDate);
      const end = r.endDate ? new Date(r.endDate) : null;
      const days = end ? Math.floor((end - start) / 86400000) + 1 : '--';
      // 计算与上一次的间隔
      let interval = '';
      if (idx < records.length - 1) {
        const prev = new Date(records[idx + 1].startDate);
        const gap = Math.floor((start - prev) / 86400000);
        interval = `<span style="font-size:10px;color:var(--text-muted);margin-left:6px">⏱️ 间隔${gap}天</span>`;
      }
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft)">
          <div style="flex:1">
            <span style="font-size:13px;font-weight:600">${start.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'})}</span>
            ${interval}
            ${end ? `<span style="font-size:12px;color:var(--text-muted)"> → ${end.toLocaleDateString('zh-CN', {month:'long',day:'numeric'})}</span>` : '<span style="font-size:11px;color:var(--pink-400)">（进行中）</span>'}
            ${r.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${escapeHtml(r.note)}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:12px;font-weight:600;color:var(--pink-500);white-space:nowrap">${days}${days!=='--'?'天':''}</span>
            <button class="inbox-action" data-action="editPeriod" data-id="${r.id}" style="padding:3px 8px">✏️</button>
            <button class="inbox-action" data-action="delPeriod" data-id="${r.id}" style="padding:3px 8px">🗑️</button>
          </div>
        </div>`;
    });
  }

  html += `</div>`;

  // 美柚同步提示
  html += `<div class="card" style="background:linear-gradient(135deg,#f0e8ff,#ffe8f0)">
    <div class="card-header">
      <div class="card-title"><span class="emoji">🔗</span>数据同步</div>
    </div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.6">
      本地记录可通过导出功能备份。如需同步至美柚App，可导出JSON，后续美柚开放数据接口后即可导入。
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-secondary" id="exportPeriodBtn" style="flex:1;font-size:12px">📤 导出经期数据</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">
      🔒 数据仅保存在本地浏览器，不会上传任何服务器
    </div>
  </div>`;

  // 怀孕几率（放在页面最下面，低存在感）
  if (records.length > 0 && ovulationDate) {
    let chance = '低';
    let chanceColor = 'var(--text-muted)';
    if (daysToOvulation >= -2 && daysToOvulation <= 2) { chance = '较高'; chanceColor = '#e8a0bf'; }
    else if (daysToOvulation >= -5 && daysToOvulation <= 5) { chance = '中等'; chanceColor = 'var(--accent-yellow)'; }
    html += `<div style="text-align:center;padding:8px 16px;margin-top:4px;font-size:10px;color:var(--text-muted);opacity:0.6">
      参考信息 · 当前阶段受孕几率：<span style="color:${chanceColor};font-weight:600">${chance}</span>
    </div>`;
  }

  container.innerHTML = html;

  setTimeout(() => {
    document.getElementById('addPeriodBtn')?.addEventListener('click', showAddPeriodModal);

    document.getElementById('endPeriodBtn')?.addEventListener('click', () => {
      const latestRecord = records[0];
      if (latestRecord && !latestRecord.endDate) {
        latestRecord.endDate = new Date().toISOString().split('T')[0];
        saveData();
        renderPage('period');
        showToast('✅ 经期已结束记录');
      }
    });

    container.querySelectorAll('[data-action="editPeriod"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = appData.period.records.find(rr => rr.id === btn.dataset.id);
        if (r) showPeriodEditModal(r);
      });
    });
    container.querySelectorAll('[data-action="delPeriod"]').forEach(btn => {
      btn.addEventListener('click', () => {
        appData.period.records = appData.period.records.filter(r => r.id !== btn.dataset.id);
        saveData();
        renderPage('period');
        showToast('记录已删除');
      });
    });

    document.getElementById('exportPeriodBtn')?.addEventListener('click', () => {
      const periodData = { app: 'bear_workspace', type: 'period', version: '1.0', exportedAt: new Date().toISOString(), records: appData.period.records, cycleAvg, periodAvg };
      const blob = new Blob([JSON.stringify(periodData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `period_export_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('经期数据已导出');
    });
  }, 0);
}

  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">记录经期</div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;text-align:center">📅 按实际日期填写即可，系统自动按日期排序分析</div>
    <div class="form-group">
      <label class="form-label">开始日期 *</label>
      <input class="form-input" type="date" id="periodStart">
    </div>
    <div class="form-group">
      <label class="form-label">结束日期（选填）</label>
      <input class="form-input" type="date" id="periodEnd">
    </div>
    <div class="form-group">
      <label class="form-label">备注（选填）</label>
      <input class="form-input" id="periodNote" placeholder="例如：痛经、量多量少、情绪状态等" maxlength="50">

    <div class="btn-row">

      <button class="btn btn-primary" id="modalConfirm">保存</button>

    document.getElementById('modalCancel').addEventListener('click', closeModal);

      appData.period.records.push({

      saveData();
      closeModal();
      renderPage('period');
      showToast('经期记录已添加');

}

function renderShoppingPage(container) {
  let html = `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">🛒</span>待买清单</div>
      <button class="add-btn" id="addShopBtn" style="padding:6px 14px;font-size:12px">＋ 添加</button>
    </div>`;

  if (appData.shopping.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🛍️</div>
      <div class="empty-state-text">购物清单空空的～<br>添加想买的物品吧</div>
    </div>`;
  } else {
    appData.shopping.forEach(item => {
      html += `
        <div class="shop-item ${item.bought ? 'shop-bought' : ''}">
          <div class="shop-info">
            <div class="shop-name">${escapeHtml(item.name)}</div>
            <div class="shop-meta">
              ${item.tag ? `<span class="tag">${escapeHtml(item.tag)}</span>` : ''}
              ${item.note ? ' · ' + escapeHtml(item.note) : ''}
            </div>
          </div>
          <div class="shop-price">${item.budget ? '¥' + item.budget : ''}</div>
          <button class="inbox-action primary" data-action="toggleBought" data-id="${item.id}">${item.bought ? '↩️' : '✅'}</button>
          <button class="inbox-action" data-action="deleteShop" data-id="${item.id}">🗑️</button>
        </div>`;
    });
  }

  html += `</div>`;

  // Link to memorial
  if (appData.memorials.length > 0) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">💝</span>纪念日关联</div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">快速为纪念日添加礼物清单</div>`;
    appData.memorials.slice(0, 3).forEach(m => {
      html += `<button class="add-btn" style="width:100%;margin-bottom:8px;background:linear-gradient(135deg, var(--accent-purple), var(--pink-400))" data-action="giftFor" data-name="${escapeHtml(m.name)}">🎁 为「${escapeHtml(m.name)}」添加礼物</button>`;
    });
    html += `</div>`;
  }

  container.innerHTML = html;

  setTimeout(() => {
    document.getElementById('addShopBtn')?.addEventListener('click', showAddShopModal);
    container.querySelectorAll('[data-action="toggleBought"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = appData.shopping.find(s => s.id === btn.dataset.id);
        if (item) { item.bought = !item.bought; saveData(); renderPage('shopping'); }
      });
    });
    container.querySelectorAll('[data-action="deleteShop"]').forEach(btn => {
      btn.addEventListener('click', () => {
        appData.shopping = appData.shopping.filter(s => s.id !== btn.dataset.id);
        saveData();
        renderPage('shopping');
      });
    });
    container.querySelectorAll('[data-action="giftFor"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.name;
        showAddShopModal('纪念日礼物', `为「${name}」准备的礼物`);
      });
    });
  }, 0);
}

      <button class="btn btn-secondary" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalConfirm">添加</button>

function handleCsvImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    let count = 0;
    lines.forEach((line, idx) => {
      if (idx === 0 && line.includes('类型')) return; // skip header
      const parts = line.split(',');
      if (parts.length >= 4) {
        const type = parts[0].trim();
        if (!['income', 'expense', 'debt'].includes(type)) return;
        appData.finance.records.push({
          id: 'csv_' + Date.now() + '_' + idx,
          type,
          amount: parts[1].trim(),
          category: parts[2].trim(),
          note: parts[3].trim(),
          date: parts[4] ? parts[4].trim() : new Date().toISOString().split('T')[0]
        });
        count++;
      }
    });
    saveData();
    renderPage('finance');
    showToast(`成功导入 ${count} 条记录`);
  };
  reader.readAsText(file);
  e.target.value = '';
}

// 朗读功能
function speakText(text) {
  if (!window.speechSynthesis) { showToast('浏览器不支持朗读'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
  showToast('🔊 朗读中...');
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 已复制'));
  } else {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('📋 已复制'); } catch(e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

function getRandomReadingItems(poolKey, count) {
  let pool = readingPool[poolKey];
  if (poolKey === 'expression') {
    // expression 是对象，合并 daily + workplace
    pool = [...pool.daily, ...pool.workplace];
  }
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

      sec.items.forEach(t => { html += sec.render(t); });
    } else {
      html += `<div style="font-size:12px;color:var(--text-muted);padding:8px 0">点击展开查看（${sec.items.length}条）</div>`;

          renderPage('reading');

          speakText(btn.dataset.text);
        } else if (action === 'copy') {
          copyText(btn.dataset.text);
        } else if (action === 'collectExpr') {
          appData.inbox.push({ id: Date.now().toString(), text: '🎤 [表达练习] ' + btn.dataset.text, source: 'quick', icon: '🎤', time: Date.now() });
