          showToast('📥 已收藏至收件箱');
        } else if (action === 'analyzeImpact') {
          showImpactModal(btn.dataset.title, btn.dataset.impact);
        } else if (action === 'hide' && section) {
          if (!appData.reading[section]) appData.reading[section] = {};
          appData.reading[section].visible = false;
          if (appData._readingExpanded === section) appData._readingExpanded = null;
          saveData();
          renderPage('reading');
          showToast('栏目已隐藏');
        } else if (section) {
          // 兜底：旧版无 action 的隐藏按钮，不再触发隐藏，避免误操作
        }
      });
    });

    document.getElementById('refreshAllReading')?.addEventListener('click', () => {
      appData._readingItems = {
        finance: getRandomReadingItems('finance', 2),
        books: getRandomReadingItems('books', 3),
        news: getRandomReadingItems('news', 4),
        expression: getRandomReadingItems('expression', 3),
        aiVideos: getRandomReadingItems('aiVideos', 2),
        podcasts: getRandomReadingItems('podcasts', 2)
      };
      saveData();
      renderPage('reading');
      showToast('✨ 全部刷新！');
    });

    document.getElementById('restoreReadingSections')?.addEventListener('click', () => {
      ['expression', 'news', 'books', 'aiVideos', 'podcasts', 'finance'].forEach(k => {
        if (appData.reading[k]) appData.reading[k].visible = true;
      });
      saveData();
      renderPage('reading');
      showToast('✅ 已恢复所有隐藏栏目');
    });
  }, 0);
}

// ========== SCRIPTS (脚本管理) ==========
function renderScriptsPage(container) {
  const scripts = appData.scripts || [];
  const statusFilter = appData._scriptFilter || 'all';
  const filtered = statusFilter === 'all' ? scripts : scripts.filter(s => s.status === statusFilter);

  let html = '';

  // 顶部操作栏
  html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--text-muted);flex:1;min-width:100px">🎬 短视频脚本统筹 · 拍摄/剪辑/发布前置管理</span>
    <button class="btn btn-secondary" id="smartParseBtn" style="padding:6px 14px;font-size:13px">🤖 智能识别</button>
    <button class="btn btn-primary" id="newScriptBtn" style="padding:6px 14px;font-size:13px">＋ 新建脚本</button>
  </div>`;

  // 状态筛选
  const statuses = [
    { key: 'all', label: '全部', icon: '📋' },
    { key: 'draft', label: '草稿', icon: '📝' },
    { key: 'ready', label: '待拍', icon: '🎥' },
    { key: 'filming', label: '拍摄中', icon: '🎬' },
    { key: 'editing', label: '剪辑中', icon: '✂️' },
    { key: 'done', label: '已发布', icon: '✅' }
  ];
  html += `<div class="inbox-filters">`;
  statuses.forEach(s => {
    html += `<div class="filter-chip ${statusFilter===s.key?'active':''}" data-script-filter="${s.key}">${s.icon} ${s.label}${s.key!=='all'?'('+scripts.filter(sc=>sc.status===s.key).length+')':''}</div>`;
  });
  html += `</div>`;

  // 脚本列表
  if (filtered.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🎬</div>
      <div class="empty-state-text">${scripts.length === 0 ? '还没有脚本～<br>点击「新建脚本」开始筹备你的短视频' : '该状态下暂无脚本'}</div>
    </div>`;
  } else {
    filtered.forEach(s => {
      const statusMap = { draft: '📝 草稿', ready: '🎥 待拍', filming: '🎬 拍摄中', editing: '✂️ 剪辑中', done: '✅ 已发布' };
      const statusColor = { draft: '#999', ready: '#ff9500', filming: '#ff5a5f', editing: '#8b5cf6', done: '#5a9e6f' };
      html += `
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1;min-width:0">
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
                <span class="tag" style="font-size:10px;padding:2px 8px;background:${statusColor[s.status]||'#999'};color:white">${statusMap[s.status]||s.status}</span>
                ${s.duration ? `<span style="font-size:11px;color:var(--text-muted)">⏱️ ${escapeHtml(s.duration)}</span>` : ''}
              </div>
              <h4 style="font-size:14px;font-weight:700;margin-bottom:4px">${escapeHtml(s.title || '未命名脚本')}</h4>
              ${s.coverIdea ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">📸 ${escapeHtml(s.coverIdea)}</div>` : ''}
            </div>
          </div>
          ${s.tags && s.tags.length ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">${s.tags.map(t=>`<span class="tag" style="font-size:9px;padding:1px 6px">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            <button class="inbox-action primary" data-action="editScript" data-id="${s.id}">✏️ 编辑</button>
            <button class="inbox-action" data-action="exportScript" data-id="${s.id}">📋 导出文案</button>
            <button class="inbox-action" data-action="scriptToInbox" data-id="${s.id}">📥 推收件箱</button>
            <button class="inbox-action" data-action="scriptToKanban" data-id="${s.id}">📌 推看板</button>
            <button class="inbox-action" data-action="delScript" data-id="${s.id}" style="color:#ff5a5f">🗑️</button>
          </div>
        </div>`;
    });
  }

  container.innerHTML = html;

  setTimeout(() => {
    // 状态筛选
    container.querySelectorAll('[data-script-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        appData._scriptFilter = chip.dataset.scriptFilter;
        renderPage('scripts');
      });
    });

    // 新建脚本
    document.getElementById('newScriptBtn')?.addEventListener('click', () => {
      showScriptModal(null);
    });

    // 智能识别
    document.getElementById('smartParseBtn')?.addEventListener('click', () => {
      showSmartParseModal();
    });

    // 脚本操作
    container.querySelectorAll('[data-action="editScript"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = scripts.find(sc => sc.id === btn.dataset.id);
        if (s) showScriptModal(s);
      });
    });

    container.querySelectorAll('[data-action="exportScript"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = scripts.find(sc => sc.id === btn.dataset.id);
        if (s) exportScriptText(s);
      });
    });

    container.querySelectorAll('[data-action="scriptToInbox"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = scripts.find(sc => sc.id === btn.dataset.id);
        if (!s) return;
        appData.inbox.push({
          id: Date.now().toString(),
          text: `🎬 [脚本] ${s.title}${s.status==='ready'?' - 待拍摄':''}${s.status==='editing'?' - 待剪辑':''}`,
          source: 'idea',
          icon: '🎬',
          time: Date.now()
        });
        saveData();
        showToast('📥 已推送至收件箱');
      });
    });

    container.querySelectorAll('[data-action="scriptToKanban"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = scripts.find(sc => sc.id === btn.dataset.id);
        if (!s) return;
        const statusMap = { draft: '待做', ready: '待做', filming: '进行中', editing: '进行中', done: '已完成' };
        const col = statusMap[s.status] || '待做';
        appData.kanban[col.toLowerCase().includes('待') ? 'todo' : col.toLowerCase().includes('进行') ? 'doing' : 'done'].push({
          id: Date.now().toString(),
          title: `🎬 ${s.title}`,
          tags: s.tags || [],
          note: s.coverIdea || '',
          deadline: '',
          createdAt: Date.now()
        });
        saveData();
        showToast(`📌 已推送至看板 - ${col}`);
      });
    });

    container.querySelectorAll('[data-action="delScript"]').forEach(btn => {
      btn.addEventListener('click', () => {
        appData.scripts = scripts.filter(sc => sc.id !== btn.dataset.id);
        saveData();
        renderPage('scripts');
        showToast('已删除');
      });
    });
  }, 0);
}

// 智能识别弹窗
function showSmartParseModal() {
  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">🤖 智能识别脚本文案</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6">
      📋 粘贴你的脚本文案、口播稿、或随手写的拍摄笔记，<br>
      AI 自动识别并填充标题、产品、道具、镜头、文案、标签等字段
    </div>
    <div class="form-group">
      <label class="form-label">粘贴文案 *</label>
      <textarea class="form-input" id="parseInput" placeholder="把你的脚本文案粘贴到这里...&#10;&#10;支持识别：&#10;- 标题（#开头或【】包裹）&#10;- 产品/品牌名&#10;- 拍摄道具和场景&#10;- 镜头/运镜要求&#10;- 口播文案（「」或直接文字）&#10;- BGM/音乐风格&#10;- 标签（#xxx）" style="min-height:180px;resize:vertical;font-size:13px;line-height:1.6"></textarea>
    </div>
    <div id="parseResult" style="margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" id="doParseBtn" style="flex:1">🤖 开始识别</button>
      <button class="btn btn-secondary" id="cancelParseBtn">取消</button>
    </div>`;

  modal.classList.add('active');

  document.getElementById('cancelParseBtn').addEventListener('click', () => {
    modal.classList.remove('active');
  });

  document.getElementById('doParseBtn').addEventListener('click', () => {
    const text = document.getElementById('parseInput').value.trim();
    if (!text || text.length < 5) { showToast('请粘贴文案内容'); return; }

    // 展示识别结果
    const resultDiv = document.getElementById('parseResult');
    resultDiv.innerHTML = `

// 智能解析脚本文案
function smartParseScript(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const result = {
    id: '', title: '', coverIdea: '', duration: '', status: 'draft',
    products: '', props: '', shots: '', voiceover: '',
    bgm: '', transition: '', subtitle: '', tags: []
  };

  // ========== 1. 提取标签 #xxx ==========
  const tagMatches = text.match(/[#＃]([^\s#＃，,。.!！、]{1,15})/g) || [];
  result.tags = [...new Set(tagMatches.map(t => t.replace(/^[#＃]/, '').trim()))].slice(0, 10);

  // ========== 2. 提取标题 ==========
  // 匹配：【标题】或 #标题（行首单独的#不算标签）
  for (const line of lines.slice(0, 5)) {
    const bracketMatch = line.match(/^[【\[《](.+?)[】\]》]$/);
    if (bracketMatch) { result.title = bracketMatch[1].trim(); break; }
    const hashTitle = line.match(/^#{1,3}\s*(.+)/);
    if (hashTitle && hashTitle[1].length > 3 && !hashTitle[1].includes('：')) {
      result.title = hashTitle[1].trim(); break;
    }
    // 第一行短文本作为标题
    if (line.length <= 30 && !line.includes('。') && !line.includes('！') && lines.indexOf(line) === 0) {
      result.title = line.replace(/[#＃]/g, '').trim();
    }
  }
  // 如果标题没匹配到，取第一行前20字
  if (!result.title) {
    result.title = lines[0].substring(0, 20).replace(/[#＃【】\[\]]/g, '').trim() || '未命名脚本';
  }

  // ========== 3. 提取时长 ==========
  const durationMatch = text.match(/(\d+[\.\d]*)\s*(秒|s|S|分|min|分钟)/);
  if (durationMatch) {
    const num = parseFloat(durationMatch[1]);
    const unit = durationMatch[2];
    if (unit.includes('秒') || unit.toLowerCase() === 's') {
      result.duration = num >= 60 ? `${(num/60).toFixed(1)}min` : `${num}s`;
    } else {
      result.duration = `${num}min`;
    }
  }
  // 也匹配 "时长：60s" 这种
  const durationLabel = text.match(/时长[：:]\s*(\S+)/);
  if (durationLabel) result.duration = durationLabel[1];

  // ========== 4. 按关键词分类提取各字段 ==========
  const keywords = {
    products: ['产品', '品牌', '商品', '好物', '种草', '推荐好物', '用到', '需要准备', '清单'],
    props: ['道具', '布景', '场景', '背景', '场地', '布置', '器材', '设备'],
    shots: ['镜头', '运镜', '景别', '特写', '全景', '近景', '远景', '推镜头', '拉镜头', '跟拍', '航拍', '机位', '分镜', '画面'],
    voiceover: ['口播', '文案', '旁白', '解说', '台词', '配音', '说', '讲'],
    bgm: ['BGM', 'bgm', '音乐', '背景音乐', '配乐', 'Bgm'],
    transition: ['转场', '过渡', '衔接'],
    subtitle: ['字幕', '花字', '文字', '标题字']
  };

  const collected = { products: [], props: [], shots: [], voiceover: [], bgm: [], transition: [], subtitle: [] };

  lines.forEach(line => {
    // 检查是否是"标签：内容"格式
    const labelMatch = line.match(/^(.+?)[：:]\s*(.+)/);
    if (labelMatch) {
      const label = labelMatch[1].trim();
      const value = labelMatch[2].trim();
      for (const [field, kws] of Object.entries(keywords)) {
        if (kws.some(kw => label.includes(kw))) {
          collected[field].push(value);
          return;
        }
      }
    }

    // 检查行内关键词
    for (const [field, kws] of Object.entries(keywords)) {
      if (collected[field].length === 0 && kws.some(kw => line.includes(kw))) {
        // 对于口播文案，收集更多内容
        if (field === 'voiceover') {
          collected[field].push(line);
        } else if (field !== 'bgm' || line.length < 30) {
          collected[field].push(line.replace(new RegExp(kws.find(kw=>line.includes(kw))), '').trim());
        }
      }
    }
  });

  // ========== 5. 口播文案特殊处理 ==========
  // 如果有「」包裹的内容，优先作为口播文案
  const quoteMatches = text.match(/[「「"](.+?)[」」"]/g);
  if (quoteMatches && quoteMatches.length > 0) {
    result.voiceover = quoteMatches.map(q => q.replace(/^[「「"]/, '').replace(/[」」"]$/, '')).join('\n');
  } else if (collected.voiceover.length > 0) {
    result.voiceover = collected.voiceover.join('\n');
  } else {
    // 如果没有明确标记，把最长的几段文字作为口播文案
    const longLines = lines.filter(l => l.length > 15 && !l.match(/^[#\d【】\[\]]/) && !result.tags.some(t => l.includes(t)));
    if (longLines.length > 0) {
      result.voiceover = longLines.slice(0, 10).join('\n');
    }
  }

  // ========== 6. 填充其他字段 ==========
  result.products = collected.products.join('\n').trim();
  result.props = collected.props.join('\n').trim();
  result.shots = collected.shots.join('\n').trim();
  result.bgm = collected.bgm.join(' ').trim();
  result.transition = collected.transition.join(' ').trim();
  result.subtitle = collected.subtitle.join(' ').trim();

  // ========== 7. 封面构思 ==========
  const coverMatch = text.match(/(?:封面|首图|封面图)[：:]\s*(.+)/);
  if (coverMatch) result.coverIdea = coverMatch[1].trim();

  return result;
}

      <button class="btn btn-secondary" id="cancelScriptBtn">取消</button>
    </div>`;

  modal.classList.add('active');

  document.getElementById('cancelScriptBtn').addEventListener('click', () => {
    modal.classList.remove('active');
  });

  document.getElementById('saveScriptBtn').addEventListener('click', () => {
    const title = document.getElementById('scTitle').value.trim();
    if (!title) { showToast('请输入标题'); return; }
    const tagsRaw = document.getElementById('scTags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
    const data = {
      id: s.id || Date.now().toString(),
      title,
      coverIdea: document.getElementById('scCover').value.trim(),
      duration: document.getElementById('scDuration').value.trim(),
      status: document.getElementById('scStatus').value,
      products: document.getElementById('scProducts').value.trim(),
      props: document.getElementById('scProps').value.trim(),
      shots: document.getElementById('scShots').value.trim(),
      voiceover: document.getElementById('scVoice').value.trim(),
      bgm: document.getElementById('scBgm').value.trim(),
      transition: document.getElementById('scTransition').value.trim(),
      subtitle: document.getElementById('scSubtitle').value.trim(),
      tags,
      createdAt: s.createdAt || Date.now(),
      updatedAt: Date.now()
    };
    if (isNew) {
      appData.scripts.push(data);
    } else {
      const idx = appData.scripts.findIndex(sc => sc.id === s.id);
      if (idx >= 0) appData.scripts[idx] = data;
    }
    saveData();
    modal.classList.remove('active');
    renderPage('scripts');
    showToast(isNew ? '✅ 脚本已创建！' : '✅ 脚本已更新！');
  });
}

function getTodayWords(count) {
  const today = new Date().toDateString();
  const seed = today.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  // 按日期轮换不同单词组
  const startIdx = (seed * count) % kaoyanWords.length;
  const words = [];
  for (let i = 0; i < count; i++) {
    words.push(kaoyanWords[(startIdx + i) % kaoyanWords.length]);
  }
  return words;
}

function renderEnglishPage(container) {
  const eng = appData.english;
  const today = new Date().toDateString();
  const todayWords = getTodayWords(20);

  // 记录今日学习
  if (!eng.learnedDates) eng.learnedDates = [];
  if (!eng.learnedDates.includes(today)) {
    eng.learnedDates.push(today);
    saveData();
  }
  if (!eng.favorites) eng.favorites = [];

  const totalDays = eng.learnedDates.length;
  const totalWords = totalDays * 20;

  let html = `
    <div class="card" style="background:linear-gradient(135deg,#e8f0ff,#ffe8f0);text-align:center">
      <div style="display:flex;justify-content:center;gap:24px">
        <div>
          <div style="font-size:28px;font-weight:800;color:var(--pink-500)">${totalDays}</div>
          <div style="font-size:11px;color:var(--text-muted)">累计学习天数</div>
        </div>
        <div>
          <div style="font-size:28px;font-weight:800;color:var(--accent-blue)">${totalWords}</div>
          <div style="font-size:11px;color:var(--text-muted)">累计单词数</div>
        </div>
        <div>
          <div style="font-size:28px;font-weight:800;color:var(--accent-green)">${eng.favorites.length}</div>
          <div style="font-size:11px;color:var(--text-muted)">已收藏</div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:13px;font-weight:700;color:var(--text-primary);flex:1">📝 今日20词</span>
      <button class="reading-toggle" id="speakAllWords" style="font-size:12px;padding:4px 12px">🔊 朗读全部</button>
    </div>`;

  todayWords.forEach((w, i) => {
    const isFav = eng.favorites.find(f => f.w === w.w);
    html += `
      <div class="reading-card" style="display:flex;align-items:center;gap:12px">
        <span style="font-size:14px;font-weight:800;color:var(--pink-400);width:24px">${i+1}</span>
        <div style="flex:1">
          <span style="font-size:15px;font-weight:700">${escapeHtml(w.w)}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-left:6px">${escapeHtml(w.p)}</span>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">${escapeHtml(w.m)}</div>
        </div>
        <button class="reading-toggle" data-action="speakWord" data-word="${escapeHtml(w.w)}" style="font-size:14px;padding:4px 10px">🔊</button>
        <button class="reading-toggle" data-action="favWord" data-w="${escapeHtml(w.w)}" data-p="${escapeHtml(w.p)}" data-m="${escapeHtml(w.m)}" style="font-size:14px;padding:4px 10px">${isFav?'⭐':'☆'}</button>
      </div>`;
  });

  // 收藏列表
  if (eng.favorites.length > 0) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">⭐</span>我的生词本</div>
        <span style="font-size:12px;color:var(--text-muted)">${eng.favorites.length}个</span>
      </div>`;
    eng.favorites.forEach((f, i) => {
      html += `
        <div class="reading-card" style="display:flex;align-items:center;gap:12px">
          <div style="flex:1">
            <span style="font-size:14px;font-weight:700">${escapeHtml(f.w)}</span>
            <span style="font-size:11px;color:var(--text-muted);margin-left:6px">${escapeHtml(f.p)}</span>
            <div style="font-size:12px;color:var(--text-secondary)">${escapeHtml(f.m)}</div>
          </div>
          <button class="reading-toggle" data-action="speakWord" data-word="${escapeHtml(f.w)}" style="font-size:14px;padding:4px 10px">🔊</button>
          <button class="reading-toggle" data-action="unfavWord" data-idx="${i}" style="font-size:14px;padding:4px 10px">🗑️</button>
        </div>`;
    });
    html += `</div>`;
  }

  container.innerHTML = html;

  setTimeout(() => {
    document.getElementById('speakAllWords')?.addEventListener('click', () => {
      if (!window.speechSynthesis) { showToast('不支持朗读'); return; }
      window.speechSynthesis.cancel();
      showToast('🔊 开始朗读20个单词...');
      todayWords.forEach((w, i) => {
        const u = new SpeechSynthesisUtterance(w.w);
        u.lang = 'en-US'; u.rate = 0.8;
        u.text = w.w + '. ' + w.m;
        setTimeout(() => window.speechSynthesis.speak(u), i * 2500);
      });
    });

    container.querySelectorAll('[data-action="speakWord"]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!window.speechSynthesis) { showToast('不支持朗读'); return; }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(btn.dataset.word);
        u.lang = 'en-US'; u.rate = 0.8;
        window.speechSynthesis.speak(u);
      });
    });

    container.querySelectorAll('[data-action="favWord"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const w = btn.dataset.w;
        const idx = eng.favorites.findIndex(f => f.w === w);
        if (idx >= 0) {
          eng.favorites.splice(idx, 1);
        } else {
          eng.favorites.push({ w: w, p: btn.dataset.p, m: btn.dataset.m });
        }
        saveData();
        renderPage('english');
      });
    });

    container.querySelectorAll('[data-action="unfavWord"]').forEach(btn => {
      btn.addEventListener('click', () => {
        eng.favorites.splice(parseInt(btn.dataset.idx), 1);
        saveData();
        renderPage('english');
      });
    });
  }, 0);
}

  { id: 'stretch', name: '拉伸练习', icon: '🧘' },

function renderPosturePage(container) {
  const p = appData.posture;
  const today = new Date().toDateString();
  const todayCheckins = (p.checkins || []).filter(c => new Date(c.date).toDateString() === today);

  let html = '';

  // 今日打卡
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">🧘</span>今日体态打卡</div>
      <span style="font-size:12px;color:var(--text-muted)">${todayCheckins.length}/${postureCheckinItems.length}</span>
    </div>`;

  postureCheckinItems.forEach(item => {
    const checked = todayCheckins.find(c => c.itemId === item.id);
    html += `
      <div class="todo-item ${checked ? 'done' : ''}" data-checkin="${item.id}">
        <div class="todo-check ${checked ? '' : ''}" style="${checked ? 'background:var(--accent-green);border-color:var(--accent-green);color:white' : ''}">✓</div>
        <div class="todo-text">${item.icon} ${item.name}</div>
      </div>`;
  });

  // 备注
  const todayNote = todayCheckins[0]?.note || '';
  html += `<div class="form-group" style="margin-top:8px">
    <input class="form-input" id="postureNote" placeholder="今日练习备注（时长、身体感受）..." value="${escapeHtml(todayNote)}" maxlength="80">
  </div>
  </div>`;

  // 视频练习推荐库
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">📺</span>视频练习推荐库</div>
      <button class="btn btn-secondary" id="refreshPostureVideos" style="padding:4px 10px;font-size:12px">🔄 换一批</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px">🚫 不含跑跳蹲减脂 · 仅体态矫正 · 点击刷新更换推荐</div>`;

  // 每个分类展示1个推荐
  Object.keys(postureVideoPool).forEach(cat => {
    const videos = postureVideoPool[cat];
    const refreshSeed = appData._postureVideoSeed || 0;
    const seed = (new Date().toDateString() + cat + refreshSeed).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const video = videos[seed % videos.length];
    const isFav = (p.favorites || []).find(f => f.url === video.url);
    html += `
      <div style="padding:12px;background:var(--pink-50);border-radius:var(--radius-md);margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <span class="tag" style="font-size:10px;padding:2px 8px;margin-bottom:4px">${cat}</span>
            <div style="font-size:13px;font-weight:600;margin-top:4px">${escapeHtml(video.title)}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">⏱️ ${video.duration} · ${escapeHtml(video.desc)}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <a href="${video.url}" target="_blank" rel="noopener" class="inbox-action primary" style="text-decoration:none;font-size:11px">▶️ 观看</a>
          <button class="inbox-action" data-action="favVideo" data-title="${escapeHtml(video.title)}" data-url="${escapeHtml(video.url)}" data-cat="${cat}" style="font-size:11px">${isFav ? '⭐ 已收藏' : '☆ 收藏'}</button>
          <button class="inbox-action" data-action="videoToInbox" data-title="${escapeHtml(video.title)}" data-url="${escapeHtml(video.url)}" style="font-size:11px">📥 存收件箱</button>
        </div>
      </div>`;
  });

  html += `</div>`;

  // 收藏的视频
  if (p.favorites && p.favorites.length > 0) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">⭐</span>我的收藏视频</div>
        <span style="font-size:12px;color:var(--text-muted)">${p.favorites.length}个</span>
      </div>`;
    p.favorites.forEach((f, i) => {
      html += `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-soft)">
          <span class="tag" style="font-size:9px;padding:2px 6px;flex-shrink:0">${f.cat}</span>
          <a href="${f.url}" target="_blank" rel="noopener" style="flex:1;font-size:12px;text-decoration:none;color:var(--text-primary)">${escapeHtml(f.title)}</a>
          <button class="inbox-action" data-action="delFavVideo" data-idx="${i}" style="font-size:11px;padding:3px 8px">🗑️</button>
        </div>`;
    });
    html += `</div>`;
  }

  // 体态记录台账
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">📝</span>体态记录台账</div>
      <button class="add-btn" id="addPostureRecord" style="padding:6px 14px;font-size:12px">＋ 记录</button>
    </div>`;

  if (!p.records || p.records.length === 0) {
    html += `<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">还没有不适记录<br>记录身体变化方便长期观察</div></div>`;
  } else {
    const sortedRecords = p.records.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
    sortedRecords.forEach(r => {
      html += `
        <div style="padding:10px;background:var(--pink-50);border-radius:var(--radius-md);margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;font-weight:600">${escapeHtml(r.issue)}</span>
            <span style="font-size:11px;color:var(--text-muted)">${r.date}</span>
          </div>
          ${r.note ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">${escapeHtml(r.note)}</div>` : ''}
        </div>`;
    });
  }
  html += `</div>`;

  // 自定义提醒
  html += `<div class="card">
    <div class="card-header">
      <div class="card-title"><span class="emoji">⏰</span>拉伸提醒</div>
      <div class="toggle ${p.reminder?.enabled ? 'on' : ''}" id="postureReminderToggle"></div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">仅在工作台内提示，不系统推送</div>
    <div class="form-group">
      <label class="form-label">提醒时间</label>
      <input class="form-input" type="time" id="postureReminderTime" value="${p.reminder?.time || '14:00'}">
    </div>
  </div>

  <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:12px">
    💪 无连续打卡要求 · 无排行榜 · 倾听身体的声音<br>今日完成${todayCheckins.length}项就好，累了就休息
  </div>`;

  container.innerHTML = html;

  setTimeout(() => {
    // 打卡
    container.querySelectorAll('[data-checkin]').forEach(item => {
      item.addEventListener('click', () => {
        const itemId = item.dataset.checkin;
        const note = document.getElementById('postureNote').value.trim();
        const existing = p.checkins.find(c => c.itemId === itemId && new Date(c.date).toDateString() === today);
        if (existing) {
          p.checkins = p.checkins.filter(c => c !== existing);
        } else {
          p.checkins.push({ id: Date.now().toString(), itemId, date: new Date().toISOString(), note });
        }
        saveData();
        renderPage('posture');
      });
    });

    // 备注实时保存
    let noteTimer;
    document.getElementById('postureNote')?.addEventListener('input', (e) => {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => {
        const note = e.target.value.trim();
        let todayRecord = p.checkins.find(c => new Date(c.date).toDateString() === today);
        if (todayRecord) { todayRecord.note = note; saveData(); }
      }, 1000);
    });

    // 刷新视频
    document.getElementById('refreshPostureVideos')?.addEventListener('click', () => {
      // 随机打乱每个分类的选取
      appData._postureVideoSeed = (appData._postureVideoSeed || 0) + 1;
      saveData();
      renderPage('posture');
      showToast('🔄 视频已更换！');
    });

    // 收藏视频
    container.querySelectorAll('[data-action="favVideo"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.dataset.url;
        const idx = p.favorites.findIndex(f => f.url === url);
        if (idx >= 0) { p.favorites.splice(idx, 1); showToast('已取消收藏'); }
        else { p.favorites.push({ title: btn.dataset.title, url, cat: btn.dataset.cat }); showToast('⭐ 已收藏'); }
        saveData();
        renderPage('posture');
      });
    });

    // 视频存入收件箱
    container.querySelectorAll('[data-action="videoToInbox"]').forEach(btn => {
      btn.addEventListener('click', () => {
        appData.inbox.push({ id: Date.now().toString(), text: `🧘 [体态练习] ${btn.dataset.title}`, source: 'quick', icon: '🧘', time: Date.now() });
        saveData();
        showToast('📥 已存入收件箱');
      });
    });

    // 删除收藏
    container.querySelectorAll('[data-action="delFavVideo"]').forEach(btn => {
      btn.addEventListener('click', () => {
        p.favorites.splice(parseInt(btn.dataset.idx), 1);
        saveData();
        renderPage('posture');
      });
    });

    // 添加记录
    document.getElementById('addPostureRecord')?.addEventListener('click', showAddPostureRecordModal);

    // 提醒开关
    document.getElementById('postureReminderToggle')?.addEventListener('click', () => {
      if (!p.reminder) p.reminder = {};
      p.reminder.enabled = !p.reminder.enabled;
      saveData();
      renderPage('posture');
      showToast(p.reminder.enabled ? '⏰ 提醒已开启' : '提醒已关闭');
    });

    // 提醒时间
    document.getElementById('postureReminderTime')?.addEventListener('change', (e) => {
      if (!p.reminder) p.reminder = {};
      p.reminder.time = e.target.value;
      saveData();
    });
  }, 0);
}

function showAddPostureRecordModal() {
  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">记录体态不适</div>
    <div class="form-group">
      <label class="form-label">不适部位/问题</label>
      <select class="form-select" id="postureIssue">
        <option value="肩颈酸痛">💆 肩颈酸痛</option>
        <option value="腰背不适">🔙 腰背不适</option>
        <option value="圆肩驼背">🫠 圆肩驼背</option>
        <option value="骨盆前倾"> pelvic 骨盆前倾</option>
        <option value="骨盆后倾"> pelvic 骨盆后倾</option>
        <option value="假胯宽">🦵 假胯宽</option>
        <option value="膝盖不适">🦵 膝盖不适</option>
        <option value="头部前倾">🧠 头部前倾</option>
        <option value="其他">📝 其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="postureRecordDate" value="${new Date().toISOString().split('T')[0]}">
    </div>
    <div class="form-group">
      <label class="form-label">详细描述（选填）</label>
      <textarea class="form-textarea" id="postureRecordNote" placeholder="例如：久坐后加重、某动作时明显..." rows="3"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalConfirm">保存</button>
    </div>`;
  modal.classList.add('active');

  setTimeout(() => {
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalConfirm').addEventListener('click', () => {
      appData.posture.records.push({
        id: Date.now().toString(),
        issue: document.getElementById('postureIssue').value,
        date: document.getElementById('postureRecordDate').value,
        note: document.getElementById('postureRecordNote').value.trim(),
        createdAt: Date.now()
      });
      saveData();
      closeModal();
      renderPage('posture');
      showToast('记录已添加');
    });
  }, 0);
}

// ========== SETTINGS ==========
function renderSettingsPage(container) {
  let html = `
    <div class="settings-group">
      <div class="settings-group-title">📱 模块显示管理</div>`;

  modules.forEach(m => {
    if (m.id === 'settings') return;
    const visible = appData.settings.modules[m.id] !== false;
    html += `
      <div class="setting-item">
        <div class="setting-label">${m.icon} ${m.name}</div>
        <div class="toggle ${visible ? 'on' : ''}" data-module="${m.id}"></div>
      </div>`;
  });

  html += `</div>

    <div class="settings-group">
      <div class="settings-group-title">🏷️ 标签管理</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px" id="tagList">
        ${appData.settings.tags.map(t => `<span class="tag" style="cursor:pointer;padding:6px 12px;font-size:12px">${escapeHtml(t)} ×</span>`).join('')}
      </div>
      <div class="add-todo">
        <input type="text" id="newTagInput" placeholder="添加新标签..." maxlength="15">
        <button class="add-btn" id="addTagBtn">＋</button>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">💾 数据管理</div>
      <button class="add-btn" id="exportDataBtn" style="width:100%;margin-bottom:8px">📤 导出数据备份</button>
      <button class="btn btn-secondary" id="importDataBtn" style="width:100%;margin-bottom:8px">📥 导入数据备份</button>
      <input type="file" accept=".json" id="importDataFile" style="display:none">
      <button class="btn btn-secondary" id="resetDataBtn" style="width:100%;color:var(--pink-500);border-color:var(--pink-300)">🗑️ 清除所有数据</button>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">ℹ️ 关于</div>
      <div class="setting-item">
        <div class="setting-label">🐻 小熊の工作台</div>
        <span style="font-size:12px;color:var(--text-muted)">v1.0</span>
      </div>
      <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:12px">
        ADHD友好 · 低焦虑设计 · 本地存储<br>数据仅保存在你的浏览器中
      </div>
    </div>`;

  container.innerHTML = html;

  setTimeout(() => {
    // Module toggles
    container.querySelectorAll('.toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const module = toggle.dataset.module;
        const current = appData.settings.modules[module] !== false;
        appData.settings.modules[module] = !current;
        saveData();
        renderPage('settings');
        renderSidebar();
        showToast(`${modules.find(m=>m.id===module)?.name} ${current?'已隐藏':'已显示'}`);
      });
    });

    // Tag management
    document.getElementById('addTagBtn')?.addEventListener('click', () => {
      const input = document.getElementById('newTagInput');
      const tag = input.value.trim();
      if (!tag) return;
      if (appData.settings.tags.includes(tag)) { showToast('标签已存在'); return; }
      appData.settings.tags.push(tag);
      saveData();
      renderPage('settings');
      showToast('标签已添加');
    });

    container.querySelectorAll('#tagList .tag').forEach(tagEl => {
      tagEl.addEventListener('click', () => {
        const tagText = tagEl.textContent.replace('×', '').trim();
        appData.settings.tags = appData.settings.tags.filter(t => t !== tagText);
        saveData();
        renderPage('settings');
      });
    });

    // Export
    document.getElementById('exportDataBtn')?.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bear_workspace_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出');
    });

    // Import
    document.getElementById('importDataBtn')?.addEventListener('click', () => {
      document.getElementById('importDataFile').click();
    });
    document.getElementById('importDataFile')?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          appData = deepMerge(defaultData, data);
          saveData();
          showToast('数据已导入');
          renderPage('settings');
          renderSidebar();
        } catch(err) {
          showToast('文件格式错误');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // Reset
    document.getElementById('resetDataBtn')?.addEventListener('click', () => {
      if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
        appData = JSON.parse(JSON.stringify(defaultData));
        saveData();
        renderPage('settings');
        renderSidebar();
        navigateTo('todo');
        showToast('数据已清除');
      }
    });
  }, 0);
}

// ========== MODAL ==========
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ========== TOAST ==========
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== UTILITIES ==========
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 修复小红书搜索 URL — 把 keyword= 后面的中文编码
function fixXhsUrl(url) {
  if (!url) return '#';
  // 如果 URL 里 keyword= 后面有未编码的中文，进行编码
  return url.replace(/keyword=([^&]*)/g, (match, kw) => {
    // 如果已经编码过（含%），不再重复编码
    if (/%[0-9A-Fa-f]{2}/.test(kw)) return match;
    return 'keyword=' + encodeURIComponent(kw);
  });
}

function timeAgo(timestamp) {
  const diff = Date.now() - timestamp;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return Math.floor(diff / 86400000) + '天前';
}

function isToday(timestamp) {
  const d1 = new Date(timestamp);
  const d2 = new Date();
  return d1.toDateString() === d2.toDateString();
}

// ========== INIT ==========
function init() {
  loadData();
  renderSidebar();
  navigateTo('todo');

  // Search button - simple page jump
  document.getElementById('searchBtn').addEventListener('click', () => {
    const query = prompt('搜索模块或功能：');
    if (!query) return;
    const found = modules.find(m => m.name.includes(query) || m.id.includes(query));
    if (found && appData.settings.modules[found.id] !== false) {
      navigateTo(found.id);
    } else {
      showToast('未找到相关模块');
    }
  });

  // Swipe to close sidebar (mobile)
  let touchStartX = 0;
  document.getElementById('sidebar').addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });
  document.getElementById('sidebar').addEventListener('touchmove', (e) => {
    const diff = e.touches[0].clientX - touchStartX;
    if (diff < -50) closeSidebar();
  });
}

init();
</script>
